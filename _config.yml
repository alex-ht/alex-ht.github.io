title: Alex Hung
author: Alex Hung
url: https://alex-ht.github.io
description: >
  Alex Hung 的個人網站。目前在 ASUS 做 AI 模型與系統，這裡記錄工作上的想法、旅遊，以及對電影與時事的隨感。

permalink: /:slug

favicon: "./logo.png"

twitter:
    username: alex780312
    card: summary_large_image

#theme: moonwalk # if you are using GitHub Pages, change it to remote_theme: abhinavs/moonwalk
remote_theme: abhinavs/moonwalk

theme_config:
  appearance: "dark"
  appearance_toggle: true
  back_home_text: "home.."
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: true
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: true
  show_tags: true
  home:
    title_projects: 作品
    title_misc_list: Details
    title_blog: 筆記
    title_old_projects: Old Projects

soopr:
  publish_token: ""

highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-soopr-seo-tag
